# Full server integration suite, including L07 and legacy review routes.
#
# Each spins up a real Postgres (pgvector) via testcontainers, builds the
# Fastify app, migrates + seeds, and exercises the routes end-to-end against
# the DB. Docker is present on ubuntu-latest, so testcontainers can pull the
# image. Docker absence or skipped tests fails this required verification.
#
# Linux only — testcontainers needs a Linux Docker daemon (Windows runners
# don't provide one).
name: server integration

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-integration.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-integration.yml'

permissions:
  contents: read

concurrency:
  group: server-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Integration tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - name: Require Docker
        run: docker info

      - name: All PostgreSQL tests
        run: pnpm exec vitest run .it.test --reporter=default --reporter=json --outputFile.json=integration-results.json

      - name: Reject skipped integration verification
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('integration-results.json', 'utf8'));
          if (!report.success || report.numPassedTests < 1 || report.numFailedTests || report.numPendingTests || report.numTodoTests) {
            throw new Error('PostgreSQL verification must run and pass with zero skips');
          }
          for (const file of ['reviews.it.test.ts', 'multi-agent.it.test.ts', 'ci.it.test.ts', 'evals.it.test.ts']) {
            const suite = report.testResults.find(item => item.name.endsWith('/test/' + file));
            if (!suite || suite.status !== 'passed' || !suite.assertionResults.length || suite.assertionResults.some(test => test.status !== 'passed')) {
              throw new Error('Mandatory suite did not execute fully: ' + file);
            }
          }
          NODE
