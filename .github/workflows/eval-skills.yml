name: Harness Skill evals
on:
  pull_request:
    paths: ['evals/**', '.claude/**', 'CLAUDE.md', '.github/workflows/eval-*.yml']
  push:
    branches: [main]
    paths: ['evals/**', '.claude/**', 'CLAUDE.md', '.github/workflows/eval-*.yml']
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run subscribed Codex on an explicitly configured trusted self-hosted runner'
        type: boolean
        default: false
      model:
        description: 'Exact accessible Codex model id (required only for live trials)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run eval:quality
      - run: npm run eval:skills
  live-subscription:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live && vars.CODEX_EVALS_SELF_HOSTED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, codex-evals]
    timeout-minutes: 15
    needs: static-quality
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_LIVE: '1'
      EVAL_MODEL: ${{ inputs.model }}
      CODEX_CLI_PATH: ${{ vars.CODEX_CLI_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run eval:live -- --suite skills --label ci-skills --concurrency 1 --timeout-ms 120000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-skills-evidence
          path: evals/results/
